<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Members Dashboard | Baal Durga Puja Samiti Benigaddaupur - 224203</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <link rel="icon" type="image/x-icon" href="/photos/favicon-192x192.png">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       ROOT
    ===================================================== */

    :root {
      --primary: #9b2226;
      --primary-dark: #7f1a1d;

      --gold: #d4af37;
      --gold-light: #e9c46a;

      --bg: #f5f6fa;
      --white: #ffffff;

      --text: #252525;
      --muted: #777;

      --border: #e5e5e5;

      --danger: #c62828;

      --shadow:
        0 10px 35px rgba(0, 0, 0, 0.07);
    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      visibility: hidden;
      margin: 0;

      font-family:
        "Poppins",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f8f8fb,
          #f2f3f7
        );

      color: var(--text);
    }


    /* =====================================================
       PAGE
    ===================================================== */

    body.auth-ready {
      visibility: visible;
    }

    .page {
      width: min(
        1400px,
        calc(100% - 32px)
      );

      margin: auto;

      padding:
        30px 0 50px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .top {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 20px;

      margin-bottom: 25px;
    }

    .title-area h1 {
      margin: 0;

      font-size:
        clamp(25px, 3vw, 36px);

      font-weight: 800;

      color: var(--primary);

      letter-spacing: -0.5px;
    }

    .title-area p {
      margin:
        5px 0 0;

      color: var(--muted);

      font-size: 13px;
    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    .btn {
      border: none;
      outline: none;

      min-height: 42px;

      padding:
        10px 17px;

      border-radius: 10px;

      font-family: inherit;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      transition:
        .2s ease;
    }

    .btn:hover {
      transform:
        translateY(-1px);
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          #a92328,
          #86191d
        );

      color: #fff;

      box-shadow:
        0 7px 20px
        rgba(155, 34, 38, .20);
    }

    .btn-primary:hover {
      box-shadow:
        0 10px 25px
        rgba(155, 34, 38, .27);
    }

    .btn-light {
      background: #f1f1f3;
      color: #444;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }


    /* =====================================================
       STAT CARDS
    ===================================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;

      margin-bottom: 20px;
    }

    .stat-card {
      background: #fff;

      border:
        1px solid rgba(0,0,0,.04);

      border-radius: 15px;

      padding: 18px 20px;

      box-shadow: var(--shadow);

      display: flex;

      align-items: center;
      justify-content: space-between;
    }

    .stat-label {
      color: #888;

      font-size: 12px;

      margin-bottom: 3px;
    }

    .stat-value {
      color: var(--primary);

      font-size: 25px;

      font-weight: 800;
    }

    .stat-icon {
      width: 44px;
      height: 44px;

      border-radius: 12px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #fff3f3;

      font-size: 19px;
    }


    /* =====================================================
       SEARCH
    ===================================================== */

    .toolbar {
      background: #fff;

      padding: 15px;

      border-radius: 15px;

      box-shadow: var(--shadow);

      margin-bottom: 18px;
    }

    .search-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;

      left: 14px;
      top: 50%;

      transform:
        translateY(-50%);

      color: #999;

      pointer-events: none;
    }

    .search {
      width: 100%;

      height: 46px;

      border:
        1px solid #ddd;

      border-radius: 10px;

      outline: none;

      padding:
        0 15px 0 42px;

      font-family: inherit;

      font-size: 13px;

      background: #fafafa;

      transition: .2s ease;
    }

    .search:focus {
      background: #fff;

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(155,34,38,.08);
    }


    /* =====================================================
       TABLE
    ===================================================== */

    .table-card {
      background: #fff;

      border-radius: 16px;

      overflow: hidden;

      box-shadow: var(--shadow);
    }

    .table-scroll {
      width: 100%;

      overflow-x: auto;
    }

    table {
      width: 100%;

      min-width: 900px;

      border-collapse: collapse;
    }

    thead th {
      padding: 14px 12px;

      background:
        linear-gradient(
          135deg,
          #9b2226,
          #861a1e
        );

      color: #fff;

      font-size: 12px;

      text-align: center;

      white-space: nowrap;
    }

    tbody td {
      padding: 13px 12px;

      border-bottom:
        1px solid #eee;

      text-align: center;

      font-size: 13px;

      vertical-align: middle;
    }

    tbody tr {
      transition: .2s ease;
    }

    tbody tr:hover {
      background: #fff8f8;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }


    /* =====================================================
       MEMBER PHOTO
    ===================================================== */

    .member-photo {
      width: 48px;
      height: 48px;

      object-fit: cover;

      border-radius: 10px;

      display: block;

      margin: auto;

      border:
        2px solid #eee;

      background: #f4f4f4;
    }

    .no-photo {
      width: 48px;
      height: 48px;

      margin: auto;

      border-radius: 10px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #f1f1f1;

      color: #999;
    }


    /* =====================================================
       ID
    ===================================================== */

    .member-id {
      font-family: monospace;

      font-size: 12px;

      color: #666;
    }


    /* =====================================================
       ROLE
    ===================================================== */

    .role-badge {
      display: inline-flex;

      padding:
        5px 10px;

      border-radius: 999px;

      background:
        #fff3d7;

      color:
        #72540b;

      font-size: 11px;

      font-weight: 700;
    }


    /* =====================================================
       ACTIONS
    ===================================================== */

    .actions {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 6px;
    }

    .action-btn {
      width: 34px;
      height: 34px;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      transition: .2s ease;
    }

    .action-btn:hover {
      transform:
        translateY(-2px);
    }

    .view-btn {
      background: #edf3ff;
      color: #2857a7;
    }

    .edit-btn {
      background: #fff3d7;
      color: #76590b;
    }

    .delete-btn {
      background: #ffeded;
      color: #c62828;
    }


    /* =====================================================
       STATE
    ===================================================== */

    .state-row td {
      padding: 50px 20px;

      color: #777;
    }

    .loader {
      width: 28px;
      height: 28px;

      margin:
        0 auto 10px;

      border:
        3px solid #eee;

      border-top-color:
        var(--primary);

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    /* =====================================================
       MODAL
    ===================================================== */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.58);

      backdrop-filter:
        blur(6px);

      -webkit-backdrop-filter:
        blur(6px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width:
        min(500px, 100%);

      max-height: 92vh;

      overflow-y: auto;

      background: #fff;

      border-radius: 18px;

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.3);

      animation:
        modalIn .25s ease;
    }

    @keyframes modalIn {

      from {
        opacity: 0;

        transform:
          translateY(15px)
          scale(.97);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

    .modal-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding:
        20px 22px;

      border-bottom:
        1px solid #eee;
    }

    .modal-head h3 {
      margin: 0;

      color: var(--primary);

      font-size: 20px;

      font-weight: 800;
    }

    .close-modal {
      width: 34px;
      height: 34px;

      border: none;

      border-radius: 50%;

      background: #f1f1f1;

      color: #555;

      font-size: 20px;

      cursor: pointer;
    }

    .modal-body {
      padding:
        22px;
    }

    .form-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 15px;
    }

    .form-group {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }

    .form-group.full {
      grid-column:
        1 / -1;
    }

    .form-group label {
      font-size: 12px;

      font-weight: 700;

      color: #444;
    }

    .form-group input {
      width: 100%;

      height: 45px;

      padding:
        0 12px;

      border:
        1px solid #ddd;

      border-radius: 9px;

      outline: none;

      font-family: inherit;

      font-size: 13px;
    }

    .form-group input:focus {
      border-color:
        var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(155,34,38,.08);
    }

    input[type="file"] {
      padding: 7px;
    }

    .current-photo {
      display: flex;

      align-items: center;

      gap: 12px;

      margin-top: 3px;
    }

    .current-photo img {
      width: 55px;
      height: 55px;

      object-fit: cover;

      border-radius: 10px;

      border: 2px solid var(--gold);
    }

    .photo-note {
      color: #888;

      font-size: 11px;
    }

    .modal-footer {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      padding:
        17px 22px;

      border-top:
        1px solid #eee;
    }


    /* =====================================================
       TOAST
    ===================================================== */

    .toast {
      position: fixed;

      right: 20px;
      bottom: 20px;

      z-index: 10000;

      max-width: 360px;

      padding:
        13px 16px;

      border-radius: 10px;

      color: #fff;

      font-size: 13px;

      font-weight: 600;

      opacity: 0;

      pointer-events: none;

      transform:
        translateY(15px);

      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateY(0);
    }

    .toast.success {
      background: #2e7d32;
    }

    .toast.error {
      background: #c62828;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .page {
        width:
          calc(100% - 20px);

        padding-top: 18px;
      }

      .top {
        flex-direction: column;

        align-items: flex-start;
      }

      .top > div:last-child {
        width: 100%;
      }

      .top > div:last-child .btn {
        flex: 1;
      }

      .stats {
        grid-template-columns:
          1fr;
      }

      .form-grid {
        grid-template-columns:
          1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .modal {
        padding: 10px;
      }

      .modal-box {
        border-radius: 15px;
      }

      .modal-head,
      .modal-body,
      .modal-footer {
        padding:
          16px;
      }

      .toast {
        left: 10px;
        right: 10px;
        bottom: 10px;

        max-width: none;
      }
    }

  </style>

</head>


<body>

  <main class="page">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="top">

      <div class="title-area">

        <h1>
          Members Dashboard
        </h1>

        <p>

      </div>


      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">

    <!-- =====================================================

      <div class="stat-card">

        <div>

          <div class="stat-label">

          <div
            class="stat-value"
            id="totalMembers"

      <div class="stat-card">

        <div>

          <div class="stat-label">

          <div
            class="stat-value"

          >
            Cloudinary
          </div>

        </div>

          ☁️
        </div>

    </div>


    <!-- =====================================================
         SEARCH
    ===================================================== -->

    <div class="toolbar">

      <div class="search-wrap">

        <span class="search-icon">
          🔎
        </span>

        <input
          id="q"
          class="search"
          type="search"
          placeholder="Search by name, phone, ID or role..."
          autocomplete="off"
        >

      </div>

    </div>


    <!-- =====================================================
         TABLE
    ===================================================== -->

    <div class="table-card">

      <div class="table-scroll">

        <table>

          <thead>

            <tr>

              <th>ID</th>

              <th>Name</th>

              <th>Phone</th>

              <th>Role</th>

              <th>Photo</th>

              <th>View</th>

              <th>Actions</th>

            </tr>

          </thead>


          <tbody id="rows">

            <tr class="state-row">

              <td colspan="7">

                <div class="loader"></div>

                Loading members...

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </main>


  <!-- =====================================================
       ADD / EDIT MODAL
  ===================================================== -->

  <div
    class="modal"
    id="memberModal"
  >

    <div class="modal-box">


      <div class="modal-head">

        <h3 id="modalTitle">
          Add New Member
        </h3>

        <button
          class="close-modal"
          onclick="closeModal()"
        >
          ×
        </button>

      </div>


      <form
        id="memberForm"
        onsubmit="saveMember(event)"
      >

        <div class="modal-body">

          <div class="form-grid">


            <!-- NAME -->

            <div class="form-group">

              <label>
                Full Name *
              </label>

              <input
                type="text"
                id="memberName"
                placeholder="Full Name"
                required
              >

            </div>


            <!-- PHONE -->

            <div class="form-group">

              <label>
                Phone Number *
              </label>

              <input
                type="text"
                id="memberPhone"
                placeholder="Phone Number"
                required
              >

            </div>


            <!-- ROLE -->

            <div class="form-group full">

              <label>
                Role *
              </label>

              <input
                type="text"
                id="memberRole"
                placeholder="Role (e.g. Volunteer)"
                required
              >

            </div>


            <!-- PHOTO -->

            <div class="form-group full">

              <label>
                Member Photo
              </label>

              <input
                type="file"
                id="memberPhoto"
                accept="image/*"
              >


              <div
                class="current-photo"
                id="currentPhoto"
                style="display:none"
              >

                <img
                  id="currentPhotoImg"
                  src=""
                  alt="Current Photo"
                >

                <span class="photo-note">
                  Current photo.<br>

            </div>

        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-light"
            onclick="closeModal()"
          >
            Cancel
          </button>


          <button
            type="submit"
            class="btn btn-primary"
            id="saveBtn"
          >
            Add Member
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =====================================================
       TOAST
    ===================================================== -->

  <div
    id="toast"
    class="toast"
  ></div>


  <script>

    /* =====================================================
       FIREBASE CONFIG
    ===================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDHzkE5CtKL--MsguovrjqIYphCy48seEY",

      authDomain:
        "baaldurgapujasamiti.firebaseapp.com",

      databaseURL:
        "https://baaldurgapujasamiti-default-rtdb.firebaseio.com",

      projectId:
        "baaldurgapujasamiti",

      storageBucket:
        "baaldurgapujasamiti.appspot.com",

      messagingSenderId:
        "158315013465",

      appId:
        "1:158315013465:web:8a185574b043c65e1c1848",

      measurementId:
        "G-L6GZVMJGVB"

    };


    firebase.initializeApp(
      firebaseConfig
    );

    /* =====================================================
       ADMIN AUTHENTICATION
       ===================================================== */

    const auth = firebase.auth();

    auth.onAuthStateChanged(user => {

      if (!user) {
        window.location.replace("login.html");
        return;
      }

      // User is authenticated — reveal dashboard.
      document.body.classList.add("auth-ready");

    });

    async function logoutAdmin() {

      try {

        await auth.signOut();

        window.location.replace("login.html");

      } catch (error) {

        console.error("Logout Error:", error);

        showToast(
          "Unable to logout.",
          "error"
        );

      }

    }


    const database =
      firebase.database();


    const membersRef =
      database.ref("members");


    /* =====================================================
       CLOUDINARY
    ===================================================== */

    const CLOUD_NAME =
      "db1vdejok";

    const UPLOAD_PRESET =
      "member-photos";


    /* =====================================================
       DOM
    ===================================================== */

    const tbody =
      document.getElementById("rows");

    const searchInput =
      document.getElementById("q");

    const totalMembers =
      document.getElementById("totalMembers");

    const visibleMembers =
      document.getElementById("visibleMembers");

    const modal =
      document.getElementById("memberModal");

    const modalTitle =
      document.getElementById("modalTitle");

    const memberForm =
      document.getElementById("memberForm");

    const memberName =
      document.getElementById("memberName");

    const memberPhone =
      document.getElementById("memberPhone");

    const memberRole =
      document.getElementById("memberRole");

    const memberPhoto =
      document.getElementById("memberPhoto");

    const currentPhoto =
      document.getElementById("currentPhoto");

    const currentPhotoImg =
      document.getElementById("currentPhotoImg");

    const saveBtn =
      document.getElementById("saveBtn");


    /* =====================================================
       STATE
    ===================================================== */

    let members = {};

    let editingId = null;


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       LOAD / REALTIME LISTENER
    ===================================================== */

    membersRef.on(
      "value",
      snapshot => {

        members = {};

        snapshot.forEach(
          child => {

            members[
              child.key
            ] =
              child.val() || {};

          }
        );


        renderMembers();

      },

      error => {

        console.error(
          error
        );

        tbody.innerHTML = `

          <tr class="state-row">

            <td colspan="7">

              ❌ Unable to load members.

            </td>

          </tr>

        `;

        showToast(
          "Error loading members",
          "error"
        );

      }
    );


    /* =====================================================
       RENDER
    ===================================================== */

    function renderMembers() {

      const query =
        searchInput.value
          .trim()
          .toLowerCase();


      const entries =
        Object.entries(
          members
        );


      totalMembers.textContent =
        entries.length;


      const filtered =
        entries.filter(
          ([id, member]) => {

            const text = [

              id,

              member.name,

              member.phone,

              member.role

            ]

              .map(
                value =>
                  String(
                    value ?? ""
                  ).toLowerCase()
              )

              .join(" ");


            return text.includes(
              query
            );

          }
        );


      visibleMembers.textContent =
        filtered.length;


      if (!filtered.length) {

        tbody.innerHTML = `

          <tr class="state-row">

            <td colspan="7">

              ${
                entries.length
                  ? "🔎 No matching members found."
                  : "👥 No members found."
              }

            </td>

          </tr>

        `;

        return;

      }


      tbody.innerHTML =
        filtered
          .map(
            ([id, member]) => {

              const safeId =
                escapeHTML(id);

              const name =
                escapeHTML(
                  member.name ||
                  "—"
                );

              const phone =
                escapeHTML(
                  member.phone ||
                  "—"
                );

              const role =
                escapeHTML(
                  member.role ||
                  "—"
                );


              const photo =
                String(
                  member.photo ||
                  ""
                ).trim();


              let photoHTML;


              if (photo) {

                photoHTML = `

                  <img
                    class="member-photo"
                    src="${escapeHTML(photo)}"
                    alt="${name}"
                    loading="lazy"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
                  >

                  <div
                    class="no-photo"
                    style="display:none"
                  >
                    👤
                  </div>

                `;

              } else {

                photoHTML = `

                  <div class="no-photo">
                    👤
                  </div>

                `;

              }


              const viewURL =
                "https://baal-durga-puja-samiti.netlify.app/verify/member.html?id="
                +
                encodeURIComponent(
                  id
                );


              return `

                <tr>

                  <td>

                    <span class="member-id">
                      ${safeId}
                    </span>

                  </td>


                  <td>

                    <strong>
                      ${name}
                    </strong>

                  </td>


                  <td>
                    ${phone}
                  </td>


                  <td>

                    <span class="role-badge">
                      ${role}
                    </span>

                  </td>


                  <td>
                    ${photoHTML}
                  </td>


                  <td>

                    <a
                      class="action-btn view-btn"
                      href="${viewURL}"
                      target="_blank"
                      rel="noopener noreferrer"
                      title="View Member Card"
                    >
                      👁
                    </a>

                  </td>


                  <td>

                    <div class="actions">

                      <button
                        class="action-btn edit-btn"
                        onclick="openEditModal('${safeId}')"
                        title="Edit"
                      >
                        ✏️
                      </button>


                      <button
                        class="action-btn delete-btn"
                        onclick="deleteMember('${safeId}')"
                        title="Delete"
                      >
                        🗑️
                      </button>

                    </div>

                  </td>

                </tr>

              `;

            }
          )
          .join("");

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    searchInput.addEventListener(
      "input",
      renderMembers
    );


    /* =====================================================
       ADD MODAL
    ===================================================== */

    function openAddModal() {

      editingId = null;

      memberForm.reset();

      modalTitle.textContent =
        "Add New Member";

      saveBtn.textContent =
        "Add Member";

      currentPhoto.style.display =
        "none";

      currentPhotoImg.src = "";

      modal.classList.add(
        "show"
      );

      setTimeout(
        () => memberName.focus(),
        100
      );

    }


    /* =====================================================
       EDIT MODAL
    ===================================================== */

    function openEditModal(id) {

      const member =
        members[id];


      if (!member) {

        showToast(
          "Member not found.",
          "error"
        );

        return;

      }


      editingId = id;


      modalTitle.textContent =
        `Edit Member — ${id}`;


      saveBtn.textContent =
        "Update Member";


      memberName.value =
        member.name || "";


      memberPhone.value =
        member.phone || "";


      memberRole.value =
        member.role || "";


      memberPhoto.value =
        "";


      if (member.photo) {

        currentPhotoImg.src =
          member.photo;

        currentPhoto.style.display =
          "flex";

      } else {

        currentPhoto.style.display =
          "none";

      }


      modal.classList.add(
        "show"
      );

    }


    /* =====================================================
       CLOSE MODAL
    ===================================================== */

    function closeModal() {

      modal.classList.remove(
        "show"
      );

      editingId = null;

      memberForm.reset();

    }


    /* =====================================================
       OUTSIDE CLICK
    ===================================================== */

    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          closeModal();

        }

      }
    );


    /* =====================================================
       ESC
    ===================================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          modal.classList.contains(
            "show"
          )
        ) {

          closeModal();

        }

      }
    );


    /* =====================================================
       CLOUDINARY UPLOAD
    ===================================================== */

    async function uploadPhoto(file) {

      const formData =
        new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "upload_preset",
        UPLOAD_PRESET
      );


      const response =
        await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
          {
            method: "POST",
            body: formData
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.secure_url
      ) {

        console.error(
          "Cloudinary:",
          data
        );

        throw new Error(
          "Photo upload failed."
        );

      }


      return data.secure_url;

    }


    /* =====================================================
       GENERATE MEMBER ID
    ===================================================== */

    async function generateMemberId() {

      const snapshot =
        await membersRef
          .once("value");


      let highestNumber = 0;


      snapshot.forEach(
        child => {

          const key =
            child.key || "";


          if (
            key.startsWith(
              "MEM"
            )
          ) {

            const number =
              parseInt(
                key.substring(3),
                10
              );


            if (
              !isNaN(number) &&
              number > highestNumber
            ) {

              highestNumber =
                number;

            }

          }

        }
      );


      return (
        "MEM" +
        String(
          highestNumber + 1
        ).padStart(
          3,
          "0"
        )
      );

    }


    /* =====================================================
       SAVE MEMBER
    ===================================================== */

    async function saveMember(
      event
    ) {

      event.preventDefault();

      if (!auth.currentUser) {
        showToast(
          "Please login as admin first.",
          "error"
        );
        window.location.replace("login.html");
        return;
      }


      const name =
        memberName.value.trim();

      const phone =
        memberPhone.value.trim();

      const role =
        memberRole.value.trim();

      const file =
        memberPhoto.files[0];


      if (
        !name ||
        !phone ||
        !role
      ) {

        showToast(
          "Please fill all required fields.",
          "error"
        );

        return;

      }


      /* ---------------------------------------------
         ADD MEMBER
      --------------------------------------------- */

      if (!editingId && !file) {

        showToast(
          "Please select a member photo.",
          "error"
        );

        return;

      }


      saveBtn.disabled =
        true;


      try {

        let photoURL;


        /* -------------------------------------------
           ADD
        ------------------------------------------- */

        if (!editingId) {

          saveBtn.textContent =
            "Uploading Photo...";


          photoURL =
            await uploadPhoto(
              file
            );


          saveBtn.textContent =
            "Saving Member...";


          const newId =
            await generateMemberId();


          const newMember = {

            name: name,

            phone: phone,

            role: role,

            photo: photoURL

          };


          await membersRef
            .child(newId)
            .set(
              newMember
            );


          showToast(
            `Member ${newId} added successfully.`,
            "success"
          );

        }


        /* -------------------------------------------
           EDIT
        ------------------------------------------- */

        else {

          const oldMember =
            members[
              editingId
            ] || {};


          photoURL =
            oldMember.photo ||
            "";


          /* -----------------------------------------
             Only upload if new photo selected
          ----------------------------------------- */

          if (file) {

            saveBtn.textContent =
              "Uploading New Photo...";


            photoURL =
              await uploadPhoto(
                file
              );

          }


          saveBtn.textContent =
            "Updating Member...";


          const updatedMember = {

            name: name,

            phone: phone,

            role: role,

            photo: photoURL

          };


          await membersRef
            .child(editingId)
            .update(
              updatedMember
            );


          showToast(
            `${editingId} updated successfully.`,
            "success"
          );

        }


        closeModal();


      } catch (error) {

        console.error(
          "Save Member Error:",
          error
        );


        showToast(
          error.message ||
          "Unable to save member.",
          "error"
        );

      }


      finally {

        saveBtn.disabled =
          false;

        saveBtn.textContent =
          editingId
            ? "Update Member"
            : "Add Member";

      }

    }


    /* =====================================================
       DELETE MEMBER
    ===================================================== */

    async function deleteMember(
      id
    ) {

      if (!auth.currentUser) {
        showToast(
          "Please login as admin first.",
          "error"
        );
        window.location.replace("login.html");
        return;
      }

      const member =
        members[id];


      if (!member) {

        showToast(
          "Member not found.",
          "error"
        );

        return;

      }


      const name =
        member.name ||
        id;


      const confirmed =
        confirm(
          `Delete member "${name}" (${id})?\n\nThis will permanently remove the member from Firebase.`
        );


      if (!confirmed) {
        return;
      }


      try {

        await membersRef
          .child(id)
          .remove();


        showToast(
          `${id} deleted successfully.`,
          "success"
        );


      } catch (error) {

        console.error(
          "Delete Error:",
          error
        );


        showToast(
          "Unable to delete member.",
          "error"
        );

      }

    }


    /* =====================================================
       TOAST
    ===================================================== */

    let toastTimer;


    function showToast(
      message,
      type = "success"
    ) {

      const toast =
        document.getElementById(
          "toast"
        );


      clearTimeout(
        toastTimer
      );


      toast.textContent =
        message;


      toast.className =
        `toast ${type} show`;


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          3000
        );

    }

  </script>

</body>
