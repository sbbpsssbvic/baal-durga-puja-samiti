<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #9b2226;
      --primary-dark: #7f1a1d;
      --gold: #d4af37;
      --text: #252525;
      --muted: #777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Poppins", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(212,175,55,.18), transparent 35%),
        linear-gradient(135deg, #f8f8fb, #f2f3f7);
      color: var(--text);
    }

    .login-box {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 25px 70px rgba(0,0,0,.12);
      border: 1px solid rgba(0,0,0,.05);
    }

    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #a92328, #86191d);
      color: #fff;
      font-size: 27px;
      box-shadow: 0 10px 25px rgba(155,34,38,.22);
    }

    h1 {
      margin: 0;
      text-align: center;
      color: var(--primary);
      font-size: 27px;
      font-weight: 800;
    }

    .subtitle {
      margin: 7px 0 25px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      color: #444;
    }

    input {
      width: 100%;
      height: 47px;
      padding: 0 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font: inherit;
      font-size: 13px;
      background: #fafafa;
    }

    input:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(155,34,38,.08);
    }

    .login-btn {
      width: 100%;
      height: 47px;
      margin-top: 4px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(135deg, #a92328, #86191d);
      box-shadow: 0 8px 22px rgba(155,34,38,.20);
    }

    .login-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .error {
      display: none;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 9px;
      background: #ffeded;
      color: #c62828;
      font-size: 12px;
      line-height: 1.5;
    }

    .error.show {
      display: block;
    }

    .loading {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🔐</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
      Sign in to access the Members Dashboard
    </p>

    <form id="loginForm">

      <div class="group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="Admin email"
          autocomplete="username"
          required
        >
      </div>

      <div class="group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        id="loginBtn"
        class="login-btn"
        type="submit"
      >
        Login
      </button>

      <div id="error" class="error"></div>

      <div id="loading" class="loading">
        Signing in...
      </div>

    </form>

  </div>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyDHzkE5CtKL--MsguovrjqIYphCy48seEY",
      authDomain: "baaldurgapujasamiti.firebaseapp.com",
      databaseURL: "https://baaldurgapujasamiti-default-rtdb.firebaseio.com",
      projectId: "baaldurgapujasamiti",
      storageBucket: "baaldurgapujasamiti.appspot.com",
      messagingSenderId: "158315013465",
      appId: "1:158315013465:web:8a185574b043c65e1c1848",
      measurementId: "G-L6GZVMJGVB"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("error");
    const loading = document.getElementById("loading");

    // Already logged in? Go directly to dashboard.
    auth.onAuthStateChanged(user => {

      if (user) {
        window.location.replace("dashboard.html");
      }

    });

    function showError(message) {

      errorBox.textContent = message;
      errorBox.classList.add("show");

    }

    form.addEventListener("submit", async event => {

      event.preventDefault();

      errorBox.classList.remove("show");

      const emailValue = email.value.trim();
      const passwordValue = password.value;

      if (!emailValue || !passwordValue) {
        showError("Please enter email and password.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";
      loading.style.display = "block";

      try {

        await auth.signInWithEmailAndPassword(
          emailValue,
          passwordValue
        );

        window.location.replace("dashboard.html");

      } catch (error) {

        console.error("Login Error:", error);

        let message = "Invalid email or password.";

        if (
          error.code === "auth/invalid-email"
        ) {
          message = "Please enter a valid email address.";
        }

        if (
          error.code === "auth/too-many-requests"
        ) {
          message = "Too many attempts. Please try again later.";
        }

        showError(message);

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
        loading.style.display = "none";

      }

    });

  </script>

</body>
</html>
